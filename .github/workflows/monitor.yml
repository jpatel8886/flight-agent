name: Monitor flight prices

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours (6x/day), UTC
  workflow_dispatch: {}       # "Run workflow" button for manual checks

permissions:
  contents: write             # commit refreshed docs/data for the dashboard

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Search and alert
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m flightagent
      - name: Commit results
        run: |
          git config user.name "flight-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Price check $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash && git push
