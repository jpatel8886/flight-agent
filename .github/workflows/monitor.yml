name: Monitor flight prices

on:
  schedule:
    - cron: "7 * * * *"      # hourly (runs take ~20 min; concurrency below prevents overlap)
  workflow_dispatch: {}       # "Run workflow" button for manual checks
  push:                       # refresh right after a merged change to search settings or code
    branches: [main]
    paths: ["config.yaml", "flightagent/**"]

permissions:
  contents: write             # commit refreshed docs/data for the dashboard

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Search and alert
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m flightagent
      - name: Commit results
        run: |
          git config user.name "flight-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Another run may have committed data while this one searched: rebuild on the
          # latest main, keep this run's results, and combine price history from both.
          cp -r docs/data "$RUNNER_TEMP/ours"
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python -m flightagent.mergedata "$RUNNER_TEMP/ours" docs/data
            git add docs/data
            git diff --cached --quiet && exit 0
            git commit -q -m "Price check $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
